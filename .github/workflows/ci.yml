name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # A throwaway MariaDB for the integration tests (main_test.go), which build their own soln_test
    # database from soln_db.sql on every run.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install CSS build dependencies
        run: npm ci

      # public/styles.css is a build artifact, not a committed file (see D1) - go:embed
      # needs it to exist on disk before `go build` runs, the same way `make build`
      # already builds it first for local/Docker builds.
      - name: Build CSS
        run: npx tailwindcss -i view/css/app.css -o public/styles.css --minify

      - name: Generate templ files
        run: go run github.com/a-h/templ/cmd/templ@v0.3.819 generate view

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # -v so the log names each integration test as PASS; without the DSN they'd silently SKIP.
      - name: Integration tests
        env:
          SOLN_TEST_DB_ROOT_DSN: "root@tcp(127.0.0.1:3306)/"
        run: go test -count=1 -run Integration -v .
